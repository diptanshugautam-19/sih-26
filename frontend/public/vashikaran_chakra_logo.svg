    <!-- Spoke 4 (60°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(60 500 500)" />
    <!-- Spoke 5 (75°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(75 500 500)" />
    <!-- Spoke 6 (90°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(90 500 500)" />
    <!-- Spoke 7 (105°) -->
