    <!-- Spoke 9 (135°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(135 500 500)" />
    <!-- Spoke 10 (150°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(150 500 500)" />
    <!-- Spoke 11 (165°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(165 500 500)" />
    <!-- Spoke 12 (180°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(180 500 500)" />
    <!-- Spoke 13 (195°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(195 500 500)" />
    <!-- Spoke 14 (210°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(210 500 500)" />
    <!-- Spoke 15 (225°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(225 500 500)" />
    <!-- Spoke 16 (240°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(240 500 500)" />
    <!-- Spoke 17 (255°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(255 500 500)" />
    <!-- Spoke 18 (270°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(270 500 500)" />
    <!-- Spoke 19 (285°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(285 500 500)" />
    <!-- Spoke 20 (300°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(300 500 500)" />
    <!-- Spoke 21 (315°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(315 500 500)" />
    <!-- Spoke 22 (330°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(330 500 500)" />
    <!-- Spoke 23 (345°) -->
    <polygon points="500,436 496,436 498,318 502,318 504,436" fill="#132B50" transform="rotate(345 500 500)" />

    <!-- 24 Small Beads between spokes near the rim -->
