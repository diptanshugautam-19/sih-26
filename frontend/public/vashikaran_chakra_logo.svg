      <!-- Shield Inner Highlight (Left half light accent, right half dark) -->
      <path
        d="M -20 -32 L 0 -32 L 0 36 C -18 16 -18 -8 -20 -32 Z"
        fill="#0284C7"
      />
      <path
        d="M 0 -32 L 20 -32 C 18 -8 18 16 0 36 Z"
        fill="#0F172A"
      />
      <!-- Shield Center Division Line -->
      <line x1="0" y1="-32" x2="0" y2="36" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- 6. ASHOKA CHAKRA (CENTERPIECE) -->
