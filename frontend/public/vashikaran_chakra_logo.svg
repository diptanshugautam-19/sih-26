    <!-- Chakra Inner Hub Border -->
    <circle cx="500" cy="500" r="64" stroke="#132B50" stroke-width="6" fill="none" />

    <!-- Solid Inner Center Hub -->
    <circle cx="500" cy="500" r="46" fill="#132B50" />

    <!-- 24 Authentic Ashoka Chakra Spokes (Each separated by 15°) -->
    <!-- Spoke 0 (0°) -->
