      d="M 136 500 A 365 365 0 0 0 280 740"
      stroke="#132B50"
      stroke-width="8"
      stroke-linecap="round"
    />
    <circle cx="280" cy="740" r="12" fill="#132B50" />
    <circle cx="280" cy="740" r="4.5" fill="#FFFFFF" />

    <!-- Horizontal connector through left gap to external terminal node -->
    <line x1="140" y1="500" x2="80" y2="500" stroke="#132B50" stroke-width="10" stroke-linecap="round" />
    <circle cx="80" cy="500" r="14" fill="#132B50" />
    <circle cx="80" cy="500" r="5" fill="#FFFFFF" />

    <!-- CYBER SECURITY SHIELD EMBLEM AT 9 O'CLOCK -->
    <g transform="translate(145, 500)">
      <!-- Shield Outer Contour -->
      <path
        d="M -24 -36 L 24 -36 C 24 -10 24 18 0 42 C -24 18 -24 -10 -24 -36 Z"
        fill="#132B50"
        stroke="#132B50"
        stroke-width="4"
        stroke-linejoin="round"
